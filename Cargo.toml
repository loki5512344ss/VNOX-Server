[workspace]
resolver = "2"
members = [
    "gateway",
    "voice-node",
    "serverd",
    "hub",
]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
license      = "GPL-3.0"
authors      = ["VNOX Contributors"]
repository   = "https://github.com/loki5512344/Vnox"
rust-version = "1.94"

[workspace.dependencies]
tokio = { version = "1.54", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek    = { version = "3", features = ["rand_core"] }
x25519-dalek     = "3"
chacha20poly1305 = "0.11"
rand             = "0.10"
uuid = { version = "1", features = ["v4"] }
hex = "0.4"
hkdf = "0.13"
sha2 = "0.11"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow    = "1"
toml = "1.1"

# Shared bounded HTTP clients for Hub OAuth and community webhooks.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form", "query", "stream"] }
hmac = "0.13"
subtle = "2.6"
