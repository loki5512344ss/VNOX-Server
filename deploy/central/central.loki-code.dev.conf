server {
    listen 80;
    listen [::]:80;
    server_name central.loki-code.dev;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/vnox-acme;
        default_type text/plain;
    }
    location ^~ /v1/auth/ { access_log off; error_log /dev/null; return 400; }
    location / { return 301 https://central.loki-code.dev$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name central.loki-code.dev;
    ssl_certificate /etc/letsencrypt/live/central.loki-code.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/central.loki-code.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # OAuth codes/state must never enter access or upstream error logs.
    location ^~ /v1/auth/ {
        access_log off;
        error_log /dev/null;
        proxy_pass http://127.0.0.1:37623;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 40s;
    }
    root /opt/vnox-central/web/current;
    index index.html;
    location ^~ /v1/ {
        proxy_pass http://127.0.0.1:37623;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location = /health { proxy_pass http://127.0.0.1:37623; }
    location = /ready { proxy_pass http://127.0.0.1:37623; }
    location = /version { proxy_pass http://127.0.0.1:37623; }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https://avatars.githubusercontent.com; connect-src 'self'; font-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

}
