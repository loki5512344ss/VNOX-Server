server {
    listen 80;
    listen [::]:80;
    server_name central.loki-code.dev;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/vnox-acme;
        default_type text/plain;
    }
    location / { return 301 https://central.loki-code.dev$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name central.loki-code.dev;
    ssl_certificate /etc/letsencrypt/live/central.loki-code.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/central.loki-code.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location / {
        proxy_pass http://127.0.0.1:37623;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
